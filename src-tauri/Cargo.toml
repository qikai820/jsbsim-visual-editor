[package]
name = "jsbsim-visual-editor"
version = "1.0.0"
description = "Visual drag-and-drop aircraft configuration editor for JSBSim"
authors = []
edition = "2021"
default-run = "jsbsim-visual-editor"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
tokio = { version = "1", features = ["full"] }
quick-xml = { version = "0.41", features = ["serialize", "overlapped-lists", "escape-html"] }
rusb = { version = "0.9", features = ["vendored"] }
serialport = { version = "4.10.1", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
